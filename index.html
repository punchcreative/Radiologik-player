<!doctype html>
<html lang="nl-NL">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RL Player</title>
    <link rel="icon" type="image/png" href="img/app-icon.png" />
    <!-- FontAwesome CSS removed - using SVG icons instead -->
    <link rel="stylesheet" type="text/css" href="css/animate.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="manifest" href="manifest.json" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="msapplication-starturl" content="./" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="theme-color" content="#031521" />
    <meta name="apple-mobile-web-app-title" content="RL Player" />
    <meta name="description" content="RL Player - RadioLogik Player" />
    <meta
      name="keywords"
      content="RadioLogik, RL Player, Radio, Player, Streamingaudio, online radio, private stream"
    />
    <meta name="author" content="Erik Kroon" />
    <meta name="copyright" content="Punch Creative" />
    <meta name="robots" content="noindex, nofollow" />
  </head>
  <body>
    <div class="cover-site">
      <div id="bgCover"></div>
      <div class="bg-mask"></div>
    </div>
    <div
      id="page-container"
      style="
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      "
    >
      <section id="player">
        <div class="container">
          <div class="row web-player d-flex justify-content-center">
            <div class="col-12 col-lg-8">
              <div class="row">
                <div class="col-12">
                  <div class="row toplay">
                    <div class="col-12">
                      <div class="row" id="toplaySong">
                        <!-- filled by script function -->
                      </div>
                    </div>
                  </div>
                  <div class="row">
                    <div class="col-12">
                      <div
                        id="currentTrackContainer"
                        class="info-current-song text-center"
                      >
                        <p
                          id="currentSongDisplay"
                          class="current-song text-uppercase"
                        >
                          Loading...
                        </p>
                        <p
                          id="currentArtistDisplay"
                          class="current-artist text-capitalize"
                        >
                          playlist data
                        </p>
                        <p id="currentDurationDisplay" class="current-duration">
                          00:00
                        </p>
                      </div>
                    </div>
                    <div
                      class="col-12 play-pause text-center mb-1 d-flex flex-column align-items-center"
                    >
                      <!-- Player & Timer Controls -->
                      <div class="mb-1 mb-lg-3">
                        <img
                          id="playerButton"
                          src="assets/icons/circle-play.svg"
                          alt="Play"
                          class="player-icon"
                        />
                      </div>

                      <!-- Volume Controls -->
                      <div
                        class="volume-control-elements d-none d-lg-block w-100"
                      >
                        <div class="row volume-control justify-content-center">
                          <div class="volume-slide col-6 col-md-4">
                            <input
                              type="range"
                              id="volume"
                              step="1"
                              min="0"
                              max="100"
                              class="slider"
                            />
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                  <!-- Upcoming Section -->
                  <div
                    id="nextSection"
                    class="row toplay mt-3"
                    style="display: none"
                  >
                    <div class="col-12">
                      <!-- <h5
                        class="section-title text-center text-uppercase small muted"
                      >
                        Upcoming
                      </h5> -->
                      <div id="nextList" class="track-list"></div>
                    </div>
                  </div>
                  <!-- History Section -->
                  <div
                    id="historySection"
                    class="row historic mt-1"
                    style="display: none"
                  >
                    <div class="col-12">
                      <!-- <h5
                        class="section-title text-center text-uppercase small muted"
                      >
                        Recently Played
                      </h5> -->
                      <div id="historicSong" class="track-list"></div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="container bulb w-auto">
          <div class="row d-flex justify-content-center">
            <div class="text-center col-12">
              <span class="nightshift d-inline ml-1">
                <img
                  id="nightshift"
                  src="assets/icons/lightbulb-light.svg"
                  alt="Night Shift"
                  class="nightshift-icon ml-2"
                />
              </span>
            </div>
          </div>
        </div>
      </section>
      <footer id="footer">
        <div class="container w-auto">
          <div class="row d-flex justify-content-center">
            <div class="text-center col-12">
              <p id="copy" class="copyright d-inline"></p>
              <!-- <span id="version-info" class="text-muted small ms-2"></span> -->
            </div>
          </div>
        </div>
      </footer>
    </div>
    <script src="https://code.jquery.com/jquery-3.2.1.min.js" defer></script>
    <script
      src="https://cdn.jsdelivr.net/npm/jquery.marquee@1.6.0/jquery.marquee.min.js"
      defer
    ></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.3/umd/popper.min.js"
      defer
    ></script>
    <script src="js/bootstrap.min.js" defer></script>
    <script src="js/env-loader.js" defer></script>
    <script src="js/script.js" defer></script>
  </body>
</html>
